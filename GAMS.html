<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kguse | Games</title>
    <link rel="stylesheet" href="styles.css">
    
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_live_Y2xlcmsuZmlsZXMua2VsbGFubm90ZmlsZXMubGlua3BjLm5ldCQ"
      src="https://clerk.files.kellannotfiles.linkpc.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript">
    </script>

    <style>
        /* Force visibility for testing */
        .sidebar { display: flex; flex-direction: column; min-height: 100vh; }
        .auth-container { margin-top: auto; padding: 20px; border-top: 1px solid #ddd; }
        
        #sign-in-btn { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            display: block; /* Ensure it's visible */
        }

        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 20px 0; 
        }

        .game-card { 
            background: #fff; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #ddd; 
            text-align: center; 
            font-size: 0.85rem; 
            font-weight: 700; 
            cursor: pointer; 
        }

        .game-card.locked { opacity: 0.6; background: #eee; cursor: not-allowed; }
        .game-card.locked::after { content: " 🔒"; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area" style="font-size: 2rem; padding: 20px; font-weight: bold;">kguse</div>
        <div class="nav-links" style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px;">
            <a href="index.html" class="nav-item">🏠 Home</a>
            <a href="games.html" class="nav-item active">🎮 Games</a>
        </div>
        
        <div class="auth-container">
            <div id="user-button"></div>
            <div id="auth-nav">
                <button id="sign-in-btn" onclick="window.location.href='https://files.kellannotfiles.linkpc.net/'">Sign In</button>
            </div>
        </div>
    </nav>

    <main class="main-content" style="padding: 20px;">
        <h1 class="page-title">Game Library</h1>
        <p id="status-text">Loading library...</p>
        
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Search library..." oninput="filterGames()" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc;">
        </div>
        <div id="sections-container" class="game-grid"></div>
    </main>

    <script>
        // Massive list of games (truncated for example, paste yours back in)
        const files = ['cl1', 'cl10bullets', 'cl1v1lol', 'clretrobowl', 'clsm64', 'clsubwaysurfers'];

        async function initClerk() {
            try {
                await Clerk.load({
                    isSatellite: true,
                    domain: 'files.kellannotfiles.linkpc.net',
                    signInUrl: 'https://files.kellannotfiles.linkpc.net/'
                });

                if (Clerk.user) {
                    // Logged in: Hide Sign In button, show user profile
                    document.getElementById('sign-in-btn').style.display = 'none';
                    Clerk.mountUserButton(document.getElementById('user-button'));
                    renderGames(false);
                    document.getElementById('status-text').innerText = "Select a game to play!";
                } else {
                    // Logged out
                    renderGames(true);
                    document.getElementById('status-text').innerHTML = "🔒 <strong>Log in to unlock all games.</strong>";
                }
            } catch (err) {
                console.error("Clerk failed to load", err);
                // If Clerk fails, still show the games in locked mode
                renderGames(true);
            }
        }

        function renderGames(isLocked) {
            const container = document.getElementById('sections-container');
            container.innerHTML = ''; // Clear previous
            
            files.forEach(file => {
                const gameCard = document.createElement('div');
                gameCard.className = isLocked ? 'game-card locked' : 'game-card';
                gameCard.innerText = file.replace(/^cl/, '').toUpperCase();

                gameCard.onclick = () => {
                    if (isLocked) {
                        window.location.href = 'https://files.kellannotfiles.linkpc.net/';
                    } else {
                        window.location.href = `play.html?game=${file}`;
                    }
                };
                container.appendChild(gameCard);
            });
        }

        function filterGames() {
            const query = document.getElementById('gameSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }

        // Run the init function
        window.addEventListener('load', initClerk);
    </script>
</body>
</html>
