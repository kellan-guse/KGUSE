<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kguse | Home</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="propertyofkgusegames.svg" type="image/svg+xml">

    <script async crossorigin="anonymous" 
        data-clerk-publishable-key="pk_live_Y2xlcmsuZmlsZXMua2VsbGFubm90ZmlsZXMubGlua3BjLm5ldCQ"
        src="https://clerk.files.kellannotfiles.linkpc.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
        type="text/javascript">
    </script>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-area">
            <img src="propertyofkgusegames.svg" alt="Kguse logo" class="sidebar-logo">
        </div>

        <div class="nav-links">
            <a href="index.html" class="nav-item active">🏠 Home</a>
            <a href="games.html" class="nav-item protected">🎮 Games</a>
            <a href="transfer.html" class="nav-item protected">🔌 Transfer</a>
            <a href="videoplayback.mp4" class="nav-item protected">🌻 Photosynthesis Video</a>
        </div>

        <div class="auth-container">
            <div id="user-button"></div>
            <div id="sign-in-button"></div>
        </div>
    </nav>

    <main class="main-content" id="main-area">
        <div id="welcome-content">
            <div class="page-header">
                <h1 class="page-title">Welcome to Kguse</h1>
            </div>

            <div class="hero-card">
                <div class="hero-logo-container">
                    <img src="propertyofkgusegames.svg" alt="kguse" class="hero-logo">
                </div>
                <p>The ultimate hub for unblocked games and TI-84 tools.</p>
                
                <p id="timer-msg" style="color: #666; font-size: 0.9rem; margin-top: 10px;">
                    Video starting in 10 seconds...
                </p>

                <div class="hero-buttons">
                    <a href="games.html" class="btn-primary protected">Browse Games</a>
                    <a href="transfer.html" class="btn-secondary protected">TI-84 Transfer</a>
                </div>
            </div>
        </div>

        <div id="player-container" style="display: none; max-width: 900px; margin: 0 auto;">
            <div class="page-header">
                <h1 class="page-title">Now Playing: Photosynthesis</h1>
            </div>
            <video id="main-video" controls width="100%" style="border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <source src="videoplayback.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <button onclick="location.reload()" class="btn-secondary" style="margin-top: 20px;">Back to Home</button>
        </div>
    </main>

    <script>
        window.addEventListener('load', async function () {
            await Clerk.load();
            
            const userButtonDiv = document.getElementById('user-button');
            const signInDiv = document.getElementById('sign-in-button');
            const protectedItems = document.querySelectorAll('.protected');
            
            // Player elements
            const welcomeContent = document.getElementById('welcome-content');
            const playerContainer = document.getElementById('player-container');
            const videoElement = document.getElementById('main-video');

            if (Clerk.user) {
                Clerk.mountUserButton(userButtonDiv);

                // --- 10 SECOND TIMEOUT TO SHOW PLAYER ---
                setTimeout(() => {
                    welcomeContent.style.display = 'none'; // Hide welcome card
                    playerContainer.style.display = 'block'; // Show video player
                    
                    // Attempt to play automatically
                    videoElement.play().catch(err => {
                        console.log("Autoplay blocked, waiting for user interaction.");
                    });
                }, 10000); // 10,000ms = 10 seconds

            } else {
                // Sign-in logic
                const btn = document.createElement('button');
                btn.innerText = "Sign In";
                btn.className = "btn-primary";
                btn.onclick = () => Clerk.openSignIn();
                signInDiv.appendChild(btn);

                protectedItems.forEach(item => {
                    item.classList.add('locked');
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        Clerk.openSignIn();
                    });
                });
                
                // Stop the timer if not signed in
                document.getElementById('timer-msg').innerText = "Sign in to view featured video.";
            }
        });
    </script>
</body>
</html>
