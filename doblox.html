<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8"/>
    <title>Game Host</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/robobs@main/style.css"/>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/robobs@main/Web%20Audio%20Plugin/howler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/robobs@b685f532590449e8ed9fa5158ffd37fa7d7c1a0d/Web%20Audio%20Plugin/WebAudio.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
        #unity-container { width: 100%; height: 100%; }
        #unity-canvas { width: 100%; height: 100%; background: #231f20; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover">
        <div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div>
    </div>

    <script>
        const buildUrl = "https://cdn.jsdelivr.net/gh/bubbls/robobs@main/Build/";
        
        // These are the parts required to assemble the game engine online
        const dataParts = ["FameGame.data.gz.part000.gz", "FameGame.data.gz.part001.gz", "FameGame.data.gz.part002.gz"].map(p => buildUrl + p);
        const wasmParts = ["FameGame.wasm.gz.part000.gz", "FameGame.wasm.gz.part001.gz", "FameGame.wasm.gz.part002.gz", "FameGame.wasm.gz.part003.gz"].map(p => buildUrl + p);

        async function combine(parts) {
            const res = await Promise.all(parts.map(p => fetch(p).then(r => r.arrayBuffer())));
            const blob = new Blob(res, { type: 'application/octet-stream' });
            return URL.createObjectURL(blob);
        }

        const config = {
            dataUrl: "",
            frameworkUrl: buildUrl + "FameGame.framework.js",
            codeUrl: "",
            streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/bubbls/robobs@tree/main/StreamingAssets",
            companyName: "LocalHost",
            productName: "Game",
        };

        const script = document.createElement("script");
        script.src = buildUrl + "FameGame.loader.js";
        script.onload = async () => {
            config.dataUrl = await combine(dataParts);
            config.codeUrl = await combine(wasmParts);
            createUnityInstance(document.querySelector("#unity-canvas"), config, (p) => {
                document.querySelector("#unity-progress-bar-full").style.width = (100 * p) + "%";
            }).then(() => {
                document.querySelector("#loading-cover").style.display = "none";
            });
        };
        document.body.appendChild(script);

        // This prevents the SDK error in your screenshot
        window.sdk = { showBanner: () => { console.log("Ads disabled for performance."); } };
    </script>
</body>
</html>
