<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>Unity Game - Ad Free</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/robobs@main/style.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/robobs@main/Web%20Audio%20Plugin/howler.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/bubbls/robobs@b685f532590449e8ed9fa5158ffd37fa7d7c1a0d/Web%20Audio%20Plugin/WebAudio.js"></script>
    
    <script type="text/javascript">
        /** * MOCK SDK BLOCK 
         * This replaces the actual ad SDKs to prevent "SDK not defined" errors.
         */
        window.SDK_OPTIONS = {
            gameId: "local_host_version",
            onEvent: function (a) { console.log("Game Event:", a.name); }
        };
        // Prevents the game from crashing when it tries to show an ad
        window.sdk = {
            showBanner: function() { console.log("Ad block: Banner suppressed."); },
            showInterstitial: function() { console.log("Ad block: Interstitial suppressed."); }
        };
    </script>
    <style>
        canvas:focus { outline: none; }
        html, body {
            padding: 0; margin: 0; overflow: hidden;
            -webkit-touch-callout: none; user-select: none;
            height: 100%; background: #000;
        }
    </style>
</head>
<body class="dark">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src=""/></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const buildUrl = "https://cdn.jsdelivr.net/gh/bubbls/robobs@main/Build/";

        // File segments for the game engine
        const dataParts = [
            "FameGame.data.gz.part000.gz",
            "FameGame.data.gz.part001.gz",
            "FameGame.data.gz.part002.gz"
        ].map(part => buildUrl + part);

        const wasmParts = [
            "FameGame.wasm.gz.part000.gz",
            "FameGame.wasm.gz.part001.gz",
            "FameGame.wasm.gz.part002.gz",
            "FameGame.wasm.gz.part003.gz"
        ].map(part => buildUrl + part);

        async function combineParts(parts) {
            try {
                const buffers = await Promise.all(
                    parts.map(part => fetch(part).then(res => {
                        if (!res.ok) throw new Error(`Network error on ${part}`);
                        return res.arrayBuffer();
                    }))
                );
                const totalSize = buffers.reduce((sum, b) => sum + b.byteLength, 0);
                const combined = new Uint8Array(totalSize);
                let offset = 0;
                for (const b of buffers) {
                    combined.set(new Uint8Array(b), offset);
                    offset += b.byteLength;
                }
                return URL.createObjectURL(new Blob([combined], { type: 'application/octet-stream' }));
            } catch (e) {
                console.error("Assembly error:", e);
                throw e;
            }
        }

        const config = {
            dataUrl: "",
            frameworkUrl: buildUrl + "FameGame.framework.js",
            codeUrl: "",
            streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/bubbls/robobs@tree/main/StreamingAssets",
            companyName: "DefaultCompany",
            productName: "HZ",
            productVersion: "0.1"
        };

        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        loadingCover.style.background = "url('https://cdn.jsdelivr.net/gh/classrooms-1/ohanganamaranes@main/background.jpg') center / cover";
        loadingCover.style.display = "";

        const script = document.createElement("script");
        script.src = buildUrl + "FameGame.loader.js";
        script.onload = async () => {
            try {
                config.dataUrl = await combineParts(dataParts);
                config.codeUrl = await combineParts(wasmParts);
                createUnityInstance(canvas, config, (progress) => {
                    document.querySelector('.spinner').style.display = "none";
                    document.querySelector("#unity-progress-bar-empty").style.display = "";
                    progressBarFull.style.width = `${100 * progress}%`;
                }).then(() => {
                    loadingCover.style.display = "none";
                });
            } catch (err) {
                console.error("Unity Init Failed:", err);
            }
        };
        document.body.appendChild(script);

        // Utility to keep game focused
        function FocusGame() { window.focus(); canvas.focus(); }
        window.addEventListener('pointerdown', FocusGame);
        window.addEventListener('touchstart', FocusGame);
    </script>
</body>
</html>
