<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGS Files</title>
    <script async crossorigin="anonymous" data-clerk-publishable-key="YOUR_PUBLISHABLE_KEY" src="https://your-clerk-frontend-api-url.clerk.accounts.dev/hotlink.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2e3244 0%, #36224b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 40px auto;
            text-align: center;
        }

        #gameSearch {
            width: 100%;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 18px;
            outline: none;
        }

        .letter-section {
            margin-bottom: 40px;
            padding: 0 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .letter-header {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(255,255,255,0.3);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .game-btn {
            background: rgb(89, 134, 218);
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 600px;
            color: white;
            text-align: left;
        }

        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            background: #79aadb;
        }

        #user-button {
            margin-top: auto;
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div id="user-button"></div>
    </div>

    <div class="main-content">
        <h1>UGS Files</h1>
        
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Search for a game...">
        </div>

        <div id="sections-container"></div>
    </div>

    <script>
        // The script uses your full array from the previous version
        const files = [
            'cl1', 'cl10bullets', 'cl1v1lol', 'cl2048', 'clbitlife', 'clbloonsTD5', 
            'clcookieclicker', 'cldoom', 'clgeometrydashscratch', 'clgranny', 
            'clminecraft1-8-8', 'clretrobowl', 'clslope', 'clvex7'
            /* ... rest of your array items ... */
        ];

        window.addEventListener('load', async function () {
            await Clerk.load();
            if (Clerk.user) {
                Clerk.mountUserButton(document.getElementById('user-button'));
                init(); 
            } else {
                Clerk.openSignIn();
            }
        });

        function init() {
            renderGames(files);

            document.getElementById('gameSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = files.filter(f => {
                    // Logic to clean the string for search comparison
                    const clean = f.startsWith('cl') ? f.substring(2) : f;
                    return clean.toLowerCase().includes(term);
                });
                renderGames(filtered);
            });
        }

        function renderGames(fileList) {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            const alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

            alphabet.forEach(char => {
                const group = fileList.filter(f => {
                    // Remove 'cl' for alphabet sorting
                    const clean = f.startsWith('cl') ? f.substring(2) : f;
                    return clean.length > 0 && clean[0].toUpperCase() === char;
                });

                if (group.length > 0) {
                    const section = document.createElement('div');
                    section.className = 'letter-section';
                    
                    const header = document.createElement('div');
                    header.className = 'letter-header';
                    header.textContent = char;
                    section.appendChild(header);

                    const btnGrid = document.createElement('div');
                    btnGrid.className = 'buttons-container';

                    group.forEach(file => {
                        const btn = document.createElement('button');
                        btn.className = 'game-btn';
                        
                        // Clean 'cl' and replace underscores for the button label
                        let display = file.startsWith('cl') ? file.substring(2) : file;
                        btn.textContent = display.replace(/_/g, ' ');
                        
                        btn.onclick = () => {
                            if (!Clerk.user) {
                                Clerk.openSignIn();
                                return;
                            }
                            
                            // Keep the 'cl' in the filename for the CDN request
                            const fileName = file.includes('.') ? file : file + '.html';
                            const url = `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/${encodeURIComponent(fileName)}?scrlcbp=.`;
                            
                            fetch(url)
                                .then(res => res.ok ? res.text() : Promise.reject())
                                .then(html => {
                                    const win = window.open("", "_blank");
                                    if (win) {
                                        win.document.open();
                                        win.document.write(html);
                                        win.document.close();
                                    }
                                })
                                .catch(() => alert("Could not load game."));
                        };
                        btnGrid.appendChild(btn);
                    });

                    section.appendChild(btnGrid);
                    container.appendChild(section);
                }
            });
        }
    </script>
</body>
</html>
