<!DOCTYPE html>
<html>
<head>
    <title>UGS Files | Games</title>
    <script async crossorigin="anonymous" data-clerk-publishable-key="YOUR_PUBLISHABLE_KEY" src="https://your-clerk-frontend-api-url.clerk.accounts.dev/hotlink.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2e3244 0%, #36224b 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
        }

        /* Sidebar - Exact clSINGLEFILE style */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .sidebar-btn {
            background: rgb(89, 134, 218);
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            text-align: center;
            min-height: 45px;
        }

        .sidebar-btn:hover {
            background: #79aadb;
            transform: scale(1.05);
        }

        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Search Input Styling */
        .search-wrapper {
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        #gameSearch {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 16px;
            outline: none;
        }

        /* Section & Button Styling */
        .letter-section {
            margin-bottom: 40px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .letter-header {
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 3px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .game-launch-btn {
            background: rgb(89, 134, 218);
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 600px;
            color: white;
            text-align: left;
            transition: 0.3s;
        }

        .game-launch-btn:hover {
            background: #79aadb;
            transform: translateY(-2px);
        }

        #user-auth-area {
            margin-top: auto;
            padding: 10px 0;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div id="user-auth-area"></div>
    </div>

    <div class="main-content">
        <h1>UGS Files</h1>
        
        <div class="search-wrapper">
            <input type="text" id="gameSearch" placeholder="Search for a game...">
        </div>

        <div id="sections-container"></div>
    </div>

    <script>
        const files = [
            'cl1', 'cl10bullets', 'cl1v1lol', 'cl2048', 'clbitlife', 'clbloonsTD5', 
            'clcookieclicker', 'cldoom', 'clgeometrydashscratch', 'clgranny', 
            'clminecraft1-8-8', 'clretrobowl', 'clslope', 'clvex7'
            // ... add the rest of your array items here
        ];

        window.addEventListener('load', async () => {
            try {
                await Clerk.load();
                if (Clerk.user) {
                    Clerk.mountUserButton(document.getElementById('user-auth-area'));
                    init();
                } else {
                    Clerk.openSignIn();
                }
            } catch (err) {
                console.error("Clerk failed:", err);
                init(); // Run anyway if Clerk fails
            }
        });

        function init() {
            const searchInput = document.getElementById('gameSearch');
            
            // Initial render
            renderAll(files);

            // Live Search
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = files.filter(f => {
                    const clean = f.startsWith('cl') ? f.substring(2) : f;
                    return clean.toLowerCase().includes(term);
                });
                renderAll(filtered);
            });
        }

        function renderAll(fileList) {
            const container = document.getElementById('sections-container');
            const sidebar = document.getElementById('sidebar');
            const authArea = document.getElementById('user-auth-area');
            
            container.innerHTML = '';
            // Clear sidebar but keep auth area at the bottom
            sidebar.innerHTML = '';
            sidebar.appendChild(authArea);

            const alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

            alphabet.forEach(char => {
                const group = fileList.filter(f => {
                    const clean = f.startsWith('cl') ? f.substring(2) : f;
                    return clean.length > 0 && clean[0].toUpperCase() === char;
                });

                if (group.length > 0) {
                    // Create Sidebar Button (Single File Logic)
                    const sBtn = document.createElement('button');
                    sBtn.className = 'sidebar-btn';
                    sBtn.textContent = char;
                    sBtn.onclick = () => document.getElementById('sec-' + char).scrollIntoView({behavior: 'smooth'});
                    sidebar.insertBefore(sBtn, authArea);

                    // Create Game Section
                    const section = document.createElement('div');
                    section.className = 'letter-section';
                    section.id = 'sec-' + char;
                    section.innerHTML = `<div class="letter-header">${char}</div>`;
                    
                    const btnGrid = document.createElement('div');
                    btnGrid.className = 'buttons-container';

                    group.forEach(file => {
                        const btn = document.createElement('button');
                        btn.className = 'game-launch-btn';
                        
                        let display = file.startsWith('cl') ? file.substring(2) : file;
                        btn.textContent = display.replace(/_/g, ' ');
                        
                        btn.onclick = () => launchGame(file);
                        btnGrid.appendChild(btn);
                    });

                    section.appendChild(btnGrid);
                    container.appendChild(section);
                }
            });
        }

        function launchGame(file) {
            if (!Clerk.user) return Clerk.openSignIn();
            
            const fileName = file.includes('.') ? file : file + '.html';
            const url = `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/${encodeURIComponent(fileName)}`;
            
            fetch(url)
                .then(r => r.ok ? r.text() : Promise.reject())
                .then(html => {
                    const win = window.open("", "_blank");
                    if (win) {
                        win.document.open();
                        win.document.write(html);
                        win.document.close();
                    }
                })
                .catch(() => alert("Could not load game."));
        }
    </script>
</body>
</html>
